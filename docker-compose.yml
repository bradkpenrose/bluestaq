services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bluestaq
    ports:
      - 5432:5432
    volumes:
      - bluestaq_data:/var/lib/postgresql
    container_name: postgres

